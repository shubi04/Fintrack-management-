services:
  web:
    build: .
    command: >
      sh -c "python manage.py migrate &&
            gunicorn fintrack.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=django-insecure-fintrack-docker-dev-key-change-in-prod
      - DEBUG=False
      - ALLOWED_HOSTS=localhost,127.0.0.1,0.0.0.0
      - CSRF_TRUSTED_ORIGINS=http://localhost:8000,http://127.0.0.1:8000
      - DATABASE_URL=postgres://fintrack:fintrack_pass@db:5432/fintrack_db
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=fintrack_db
      - POSTGRES_USER=fintrack
      - POSTGRES_PASSWORD=fintrack_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fintrack -d fintrack_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
