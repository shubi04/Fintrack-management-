{% extends "core/base.html" %}
{% block title %}Login · FinTrack AI{% endblock %}
{% block body %}
<div class="auth"><div class="card">
 <div class="brand" style="padding:0"><img class="logo" src="/static/img/favicon.svg" alt="">FinTrack AI</div>
 <h1>Welcome back</h1><p class="sub">Log in to see your finances.</p>
 <form method="post" data-loading>{% csrf_token %}
  {% if form.non_field_errors %}<div class="err" style="margin-bottom:10px">{{ form.non_field_errors.0 }}</div>{% endif %}
  <label class="field"><span>Email</span>{{ form.username }}</label>
  <label class="field"><span>Password</span><div class="pw">{{ form.password }}<button type="button" data-pw-toggle aria-label="Show password"><svg class="i"><use href="#i-eye"/></svg></button></div></label>
  <input type="hidden" name="next" value="{{ request.GET.next }}">
  <button class="btn btn-primary btn-block">Log in</button>
 </form>
 <p class="muted" style="text-align:center;margin:14px 0 0">New here? <a href="{% url 'register' %}"><b>Create account</b></a></p>
</div></div>
{% endblock %}
