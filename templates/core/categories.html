{% extends 'base.html' %}{% block content %}<div class="topbar"><h1>Categories</h1></div><div class="content-grid"><section class="panel"><h2>Create category</h2><form method="post" class="form-stack">{% csrf_token %}{% for f in form %}<label>{{ f.label }}{{ f }}{{ f.errors }}</label>{% endfor %}<button class="btn primary">Add category</button></form></section><section class="panel"><h2>Your categories</h2>{% for c in categories %}<div class="category-item"><i style="background:{{ c.color }}"></i><b>{{ c.name }}</b><span>{{ c.get_kind_display }}</span></div>{% empty %}<p class="empty">No categories.</p>{% endfor %}</section></div>{% endblock %}
